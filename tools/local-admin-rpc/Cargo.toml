[package]
name = "secs-local-admin-rpc-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
[[bin]]
name = "secs-local-admin-rpc-v3"
path = "src/bin/v3.rs"
[workspace]
resolver = "3"
[dependencies]
castalia-wallet-presentation = { path = "../read-authority/vendor/castalia-wallet-presentation" }
base64 = "0.22"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"

secs-grant-contract = { path = "../../crates/secs-grant-contract" }
