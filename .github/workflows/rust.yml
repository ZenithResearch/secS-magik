name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "codex/credential-presentation-v2" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Force Rust to backtrace on panics during tests
  RUST_BACKTRACE: 1

jobs:
  standalone_read_authority:
    # This is a separate workspace; the root tests do not cover it.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tools/read-authority
    - name: Verify retained Wallet source hashes
      run: python3 tools/read-authority/check_source.py
    - name: Test standalone native read adapter and contract
      working-directory: tools/read-authority
      run: |
        cargo fmt --all -- --check
        cargo clippy --locked --all-targets -- -D warnings
        cargo test --locked
        cargo test --locked --manifest-path vendor/castalia-wallet-presentation/Cargo.toml
        cargo build --locked

  supply_chain_audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Fails on any known RUSTSEC vulnerability in Cargo.lock. Unmaintained-crate
    # advisories surface as warnings; any ignore must live in audit.toml with a
    # written justification, never a blanket allow.
    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit@0.22.1

    - name: Audit dependency advisories
      run: python3 scripts/audit-rust-locks.py

  wasm_ffi_check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "secs-magik-wasm"

    # The wasm/uniffi FFI surface is the only consumer of the uniffi
    # dependency and is invisible to host builds (ffi.rs is wasm32-gated).
    # Without this lane, uniffi/wasm breakage has no CI signal: the 0.28 bump
    # broke setup_scaffolding placement silently, and the Dependabot 0.31 bump
    # was all-green while failing to compile on wasm32 (#111).
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Check wasm32 + uniffi FFI surface
      run: cargo check -p libsec-core --target wasm32-unknown-unknown --features uniffi

    # M13.4b: the browser permission control panel compiles the shared
    # secs-permissions model to wasm32 via wasm-bindgen. Host builds never
    # exercise the wasm cdylib, so without this lane panel breakage is silent.
    - name: Check wasm32 permission panel
      run: cargo check -p panel --target wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: Build and test reproducible browser intake sealer
      run: |
        ./scripts/build-browser-intake-sealer.sh /tmp/secs-intake-package-a
        ./scripts/build-browser-intake-sealer.sh /tmp/secs-intake-package-b
        diff -qr /tmp/secs-intake-package-a /tmp/secs-intake-package-b
        node ./scripts/test-browser-intake-sealer.mjs /tmp/secs-intake-package-a

  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # 0. Initialize Rust Cache
    # This action automatically caches ~/.cargo/registry, ~/.cargo/git, and target/
    - name: Setup Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        # Group the cache across all Rust workspace jobs sharing this key prefix
        shared-key: "secs-magik"

    # 1. Enforce Formatting
    - name: Check Formatting
      run: cargo fmt --all -- --check

    # 2. Enforce Zero Warnings (Clippy)
    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    # 3. Build Everything (including tests and benchmarks without running them)
    - name: Build All Targets
      run: cargo build --workspace --all-targets --all-features --verbose

    # 4. Execute the Hardened Test Suite
    - name: Run Tests
      run: cargo test --workspace --all-targets --all-features --verbose
