[workspace]
resolver = "2"
members = ["core", "client", "server", "permissions", "panel", "crates/secs-devgraph-work-contract", "crates/secs-native-private-files"]

[workspace.dependencies]
devgraph-work-protocol = { git = "https://github.com/ZenithResearch/devgraph.git", rev = "1003cc3c7ab55ab34d66fbff8832a3ac18aa8ae2" }
castalia-wallet-devgraph-presentation = { git = "https://github.com/bananawalnut/castalia-wallet.git", rev = "d6f2b5579bce88058b1887a07a348453a522105e" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
ed25519-dalek = "2"
sha2 = "0.11"
x25519-dalek = "2"
chacha20poly1305 = "0.11"
rs-merkle = "1"
rand = "0.8"
uniffi = "0.32"
