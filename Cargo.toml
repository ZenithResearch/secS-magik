[workspace]
resolver = "2"
members = ["core", "client", "server", "permissions", "panel", "crates/secs-devgraph-work-contract", "crates/secs-native-private-files"]

[workspace.dependencies]
devgraph-work-protocol = { git = "https://github.com/ZenithResearch/devgraph.git", rev = "3454db330ec4a1b42352367652b2a0ceb5a066c4" }
castalia-wallet-devgraph-presentation = { git = "https://github.com/bananawalnut/castalia-wallet.git", rev = "3216144e8df04582e921810462845efc8c2cf390" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
ed25519-dalek = "2"
sha2 = "0.11"
x25519-dalek = "2"
chacha20poly1305 = "0.11"
rs-merkle = "1"
rand = "0.8"
uniffi = "0.32"
